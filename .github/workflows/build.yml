name: Build AcidModLoader

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 libnss3 libasound2

      - name: Construir
        run: python build_exe.py --no-pause

      - uses: actions/upload-artifact@v4
        with:
          name: AcidModLoader-${{ runner.os }}
          path: Ejecutables/*

  publish:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: Ejecutables
          merge-multiple: true

      - name: Listar
        run: ls -la Ejecutables

      - uses: actions/upload-artifact@v4
        with:
          name: AcidModLoader-Todos
          path: Ejecutables/*

      - name: Publicar en el release latest (archivos separados)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          chmod +x Ejecutables/AcidModLoaderLin || true
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Latest" --notes "Ultimo build automatico" --target "${{ github.sha }}"
          gh release upload latest Ejecutables/* --clobber

      - name: Publicar Release de version (solo con tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Ejecutables/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
